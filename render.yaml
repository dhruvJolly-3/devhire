# Render blueprint for the DevHire API.
# Render → New → Blueprint → point at this repo. MONGODB_URI and JWT_SECRET
# are marked sync:false, so Render prompts for them instead of storing them
# in this file.
services:
  - type: web
    name: devhire-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
